let width=0,height=0,dpr=1,scale=1,center={x:0,y:0},radius=1,contentTop=130,yaw=-.38,pitch=.18,selected=centerId,hover=null,query='',pointer=null,inside=false,autoRotate=!reducedMotion.matches,raf=0,lastFrame=0;
const shell=nodes.filter(n=>n.id!==centerId);
const positions=[];
for(let i=0;i<shell.length;i++){
  const y=1-2*(i+.5)/shell.length,ring=Math.sqrt(1-y*y),angle=i*Math.PI*(3-Math.sqrt(5));
  positions.push({x:Math.cos(angle)*ring,y,z:Math.sin(angle)*ring});
}
positions.sort((a,b)=>Math.atan2(a.x,a.z)-Math.atan2(b.x,b.z));
const groupedShell=[...shell].sort((a,b)=>groupNames.indexOf(a.domain)-groupNames.indexOf(b.domain)||(a.type==='索引'?-1:0)-(b.type==='索引'?-1:0)||a.title.localeCompare(b.title,'zh-CN'));
for(let i=0;i<groupedShell.length;i++)Object.assign(groupedShell[i],positions[i]);
for(const n of nodes)n.radius=3.8+Math.min(3.5,Math.sqrt(adjacency.get(n.id).size)*.7);
document.getElementById('graph-count').textContent=nodes.length+' 个节点 · '+edges.length+' 条关联';
document.getElementById('updated').textContent='更新至 '+DATA.updated;
const domainLabels={'个人背景':'背景','想法与偏好':'想法','生活与关系':'生活','学习与成长':'学习','项目与实践':'项目','阅读与创作':'创作','档案入口':'导航'};
const legendTypes=groupNames.filter(domain=>nodes.some(n=>n.domain===domain)).map(domain=>[domain,domainLabels[domain]]);
for(const [domain,label] of legendTypes){
  const span=document.createElement('span'),dot=document.createElement('i');span.title=domain;dot.className='dot';dot.style.background=getColor(domain);span.append(dot,document.createTextNode(label));document.getElementById('legend').append(span);
}
function resolveNote(raw){
  const id=raw.split('|')[0].split('#')[0].trim().replace(/\.md$/i,'');
  if(!id&&raw.split('|')[0].includes('#'))return byId.get(selected);
  return byId.get(id)||DATA.notes.find(n=>n.id.split('/').at(-1)===id);
}
function addInline(parent,text){
  const expression=/\[\[([^\]\n]+)\]\]|\*\*([^*]+)\*\*|`([^`]+)`/g;let last=0;
  for(const m of text.matchAll(expression)){
    parent.append(document.createTextNode(text.slice(last,m.index)));
    if(m[1]){
      const note=resolveNote(m[1]),label=m[1].split('|')[1]||note?.title||m[1];
      const button=document.createElement('button');button.type='button';button.className='wiki';button.textContent=label;
      if(note)button.addEventListener('click',()=>selectNote(note.id,true));else button.disabled=true;
      parent.append(button);
    }else{const el=document.createElement(m[2]?'strong':'code');el.textContent=m[2]||m[3];parent.append(el);}
    last=m.index+m[0].length;
  }
  parent.append(document.createTextNode(text.slice(last)));
}
function renderText(text){
  const host=document.getElementById('reader-body');host.replaceChildren();
  let paragraph=null,ul=null,firstTitle=true;
  for(const line of text.split('\n')){
    if(/^# /.test(line)&&firstTitle){firstTitle=false;continue;}
    if(!line.trim()){paragraph=null;ul=null;continue;}
    const heading=line.match(/^(#{1,3})\s+(.+)$/);
    if(heading){const h=document.createElement(heading[1].length===1?'h2':'h'+heading[1].length);addInline(h,heading[2]);host.append(h);paragraph=null;ul=null;continue;}
    if(/^- /.test(line)){
      if(!ul){ul=document.createElement('ul');host.append(ul);}
      const li=document.createElement('li');addInline(li,line.slice(2));ul.append(li);paragraph=null;continue;
    }
    ul=null;
    if(/^> /.test(line)){const quote=document.createElement('blockquote');addInline(quote,line.slice(2));host.append(quote);paragraph=null;continue;}
    if(!paragraph){paragraph=document.createElement('p');host.append(paragraph);}else paragraph.append(document.createTextNode(' '));
    addInline(paragraph,line);
  }
}
function matches(n){return !query||(n.title+' '+n.domain+' '+n.type+' '+n.tags.join(' ')+' '+n.text).toLocaleLowerCase().includes(query);}
function renderList(){
  list.replaceChildren();const filtered=nodes.filter(matches);
  if(!filtered.length){const p=document.createElement('p');p.className='empty';p.textContent='暂时没有找到这条笔记。';list.append(p);}
  for(const domain of groupNames){
    const group=filtered.filter(n=>n.domain===domain).sort((a,b)=>(a.type==='索引'?-1:0)-(b.type==='索引'?-1:0)||a.title.localeCompare(b.title,'zh-CN'));if(!group.length)continue;
    const heading=document.createElement('div');heading.className='group-title';heading.textContent=domain+' · '+group.length;list.append(heading);
    for(const n of group){
      const button=document.createElement('button');button.type='button';button.className='note-item'+(n.id===selected?' active':'');button.setAttribute('aria-current',n.id===selected?'page':'false');
      const dot=document.createElement('span');dot.className='dot';dot.style.background=getColor(n);button.append(dot,document.createTextNode(n.title));
      button.addEventListener('click',()=>selectNote(n.id,true));list.append(button);
    }
  }
}
function selectNote(id,focus=false){
  const note=byId.get(id);if(!note)return;selected=id;
  document.getElementById('reader-title').textContent=note.title;
  const type=document.getElementById('reader-type');type.replaceChildren();const dot=document.createElement('span');dot.className='dot';dot.style.background=getColor(note);type.append(dot,document.createTextNode(note.domain+' · '+note.type));
  renderText(note.text);const tags=document.getElementById('tags');tags.replaceChildren();
  for(const name of note.tags){const el=document.createElement('span');el.className='tag';el.textContent='#'+name;tags.append(el);}
  const related=document.getElementById('related');related.replaceChildren();
  const neighbors=new Set(note.links);for(const n of DATA.notes)if(n.links.includes(id))neighbors.add(n.id);
  for(const relatedId of neighbors){const other=byId.get(relatedId);if(!other)continue;const button=document.createElement('button');button.type='button';button.className='related-item';button.textContent=other.title;button.addEventListener('click',()=>selectNote(other.id,true));related.append(button);}
  document.querySelector('.reader').scrollTop=0;renderList();
  if(focus&&nodeById.has(id)){
    const n=nodeById.get(id);setAutoRotate(false);hover=null;scale=Math.min(scale,1.2);
    if(n.x||n.y||n.z){yaw=Math.atan2(-n.x,n.z)+.4;pitch=Math.atan2(n.y,Math.hypot(n.x,n.z))-.2;}
  }
  draw();
}
function fit(){
  if(!width||!height)return;
  contentTop=matchMedia('(max-width:820px)').matches?150:130;const bottom=76;
  radius=Math.max(35,Math.min((width-64)/2,(height-contentTop-bottom)/2)*.9);
  center={x:width/2,y:(contentTop+height-bottom)/2};scale=1;draw();
}
function rotate(x,y,z){
  const rx=x*Math.cos(yaw)+z*Math.sin(yaw),rz=z*Math.cos(yaw)-x*Math.sin(yaw);
  return{x:rx,y:y*Math.cos(pitch)-rz*Math.sin(pitch),z:y*Math.sin(pitch)+rz*Math.cos(pitch)};
}
function project(point){
  const perspective=4/(4-point.z);
  return{x:center.x+point.x*radius*scale*perspective,y:center.y+point.y*radius*scale*perspective,z:point.z,perspective};
}
function drawSphere(accent){
  const size=radius*scale*4/Math.sqrt(15);
  const glow=ctx.createRadialGradient(center.x-size*.28,center.y-size*.35,size*.04,center.x,center.y,size);
  glow.addColorStop(0,accent);glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow;ctx.globalAlpha=.09;ctx.beginPath();ctx.arc(center.x,center.y,size,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=accent;ctx.globalAlpha=.13;ctx.lineWidth=1;ctx.stroke();
  const rings=[];
  for(const latitude of [-Math.PI/3,-Math.PI/6,0,Math.PI/6,Math.PI/3]){
    rings.push(t=>({x:Math.cos(latitude)*Math.cos(t),y:Math.sin(latitude),z:Math.cos(latitude)*Math.sin(t)}));
  }
  for(let i=0;i<4;i++){
    const longitude=i*Math.PI/4;
    rings.push(t=>({x:Math.cos(t)*Math.cos(longitude),y:Math.sin(t),z:Math.cos(t)*Math.sin(longitude)}));
  }
  for(const front of [false,true]){
    ctx.globalAlpha=front?.11:.035;ctx.beginPath();
    for(const ring of rings){
      const start=ring(0);let previous=project(rotate(start.x,start.y,start.z));
      for(let i=1;i<=80;i++){
        const p=ring(i/80*Math.PI*2),next=project(rotate(p.x,p.y,p.z));
        if((next.z+previous.z>=0)===front){ctx.moveTo(previous.x,previous.y);ctx.lineTo(next.x,next.y);}
        previous=next;
      }
    }
    ctx.stroke();
  }
}
function draw(){
  if(!width||!height)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
  const style=getComputedStyle(document.documentElement),foreground=style.getPropertyValue('--text').trim(),neutral=style.getPropertyValue('--muted').trim(),accent=style.getPropertyValue('--accent').trim(),background=style.getPropertyValue('--bg').trim(),focus=hover||selected;
  const palette=Object.fromEntries([...new Set([...Object.values(colors),...Object.values(domainColors)])].map(color=>[color,style.getPropertyValue(color).trim()]));
  drawSphere(accent);
  for(const n of nodes){
    const p=project(rotate(n.x,n.y,n.z));
    n.sx=p.x;n.sy=p.y;n.depth=(p.z+1)/2;n.rz=p.z;n.sr=n.radius*p.perspective*Math.pow(scale,.25);
  }
  for(const edge of edges){
    const a=edge.source,b=edge.target,active=a.id===focus||b.id===focus,depth=(a.depth+b.depth)/2,match=!query||matches(a)||matches(b);
    ctx.strokeStyle=active?accent:neutral;ctx.globalAlpha=(active?.12+depth*.32:.025+depth*.1)*(match?1:.15);ctx.lineWidth=active?1.05:.7;
    ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.stroke();
  }
  for(const n of [...nodes].sort((a,b)=>a.rz-b.rz)){
    const active=n.id===focus||adjacency.get(focus)?.has(n.id),match=matches(n);
    ctx.globalAlpha=(.24+n.depth*.76)*(match?1:.1)*(active?1:.8);ctx.fillStyle=palette[colorKey(n)]||neutral;
    ctx.beginPath();ctx.arc(n.sx,n.sy,n.sr,0,Math.PI*2);ctx.fill();
    if(n.id===selected){ctx.strokeStyle=palette[colorKey(n)]||accent;ctx.lineWidth=1.2;ctx.globalAlpha=.72;ctx.beginPath();ctx.arc(n.sx,n.sy,n.sr+4,0,Math.PI*2);ctx.stroke();}
  }
  const occupied=[];
  const priority=n=>(n.id===focus?100:0)+(matches(n)&&query?30:0)+n.depth*8+Math.sqrt(adjacency.get(n.id).size);
  const ordered=[...nodes].sort((a,b)=>priority(b)-priority(a));
  for(const n of ordered){
    if(!matches(n))continue;
    ctx.font=(n.depth>.6||n.id===focus?'12':'11')+'px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
    const x=n.sx,y=n.sy,tw=ctx.measureText(n.title).width;
    const positions=[[x+n.sr+7,y+4],[x-tw/2,y-n.sr-8],[x-tw-n.sr-7,y+4],[x-tw/2,y+n.sr+17]];
    let chosen=null;
    for(const [tx,ty] of positions){const box={x:tx-3,y:ty-12,w:tw+6,h:17};if(box.x<5||box.x+box.w>width-5||box.y<contentTop||box.y+box.h>height-65)continue;if(!occupied.some(b=>box.x<b.x+b.w&&box.x+box.w>b.x&&box.y<b.y+b.h&&box.y+box.h>b.y)){chosen=[tx,ty,box];break;}}
    if(!chosen)continue;occupied.push(chosen[2]);
    ctx.globalAlpha=n.id===focus?1:.28+n.depth*.65;ctx.strokeStyle=background;ctx.lineWidth=3;ctx.lineJoin='round';ctx.strokeText(n.title,chosen[0],chosen[1]);ctx.fillStyle=foreground;ctx.fillText(n.title,chosen[0],chosen[1]);
  }
  ctx.globalAlpha=1;
}
function tick(){
  raf=0;if(!autoRotate||inside||pointer||document.hidden){lastFrame=0;return;}
  const now=performance.now(),elapsed=Math.min(50,lastFrame?now-lastFrame:16);lastFrame=now;yaw+=elapsed*.000065;draw();raf=requestAnimationFrame(tick);
}
function wake(){if(autoRotate&&!inside&&!pointer&&!document.hidden&&!raf){lastFrame=0;raf=requestAnimationFrame(tick);}}
function setAutoRotate(value){
  autoRotate=value;const button=document.getElementById('auto-rotate'),label=value?'暂停自动旋转':'开始自动旋转';
  button.setAttribute('aria-pressed',String(value));button.setAttribute('aria-label',label);button.title=label;button.textContent=value?'Ⅱ':'▷';
  if(!value&&raf){cancelAnimationFrame(raf);raf=0;lastFrame=0;}else wake();
}
function point(event){const rect=canvas.getBoundingClientRect();return{x:event.clientX-rect.left,y:event.clientY-rect.top};}
function hit(p){return [...nodes].sort((a,b)=>b.rz-a.rz).find(n=>Math.hypot(p.x-n.sx,p.y-n.sy)<Math.max(12,n.sr+5))||null;}
canvas.addEventListener('pointerdown',event=>{
  if(pointer)return;const p=point(event);setAutoRotate(false);pointer={...p,startX:p.x,startY:p.y,node:hit(p),moved:false,id:event.pointerId};canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove',event=>{
  const p=point(event);
  if(pointer&&event.pointerId===pointer.id){
    pointer.moved ||=Math.hypot(p.x-pointer.startX,p.y-pointer.startY)>4;
    if(pointer.moved){yaw+=(p.x-pointer.x)*.006;pitch-=(p.y-pointer.y)*.006;hover=null;}
    pointer.x=p.x;pointer.y=p.y;draw();
  }else if(!pointer){const n=hit(p);hover=n?.id||null;canvas.style.cursor=n?'pointer':'grab';draw();}
});
canvas.addEventListener('pointerup',event=>{
  if(!pointer||event.pointerId!==pointer.id)return;const tapped=!pointer.moved?pointer.node:null;pointer=null;
  if(canvas.hasPointerCapture(event.pointerId))canvas.releasePointerCapture(event.pointerId);
  if(tapped)selectNote(tapped.id);wake();
});
canvas.addEventListener('pointercancel',event=>{if(pointer?.id===event.pointerId){pointer=null;hover=null;draw();wake();}});
canvas.addEventListener('pointerenter',()=>{inside=true;});
canvas.addEventListener('pointerleave',()=>{inside=false;if(!pointer){hover=null;draw();wake();}});
function zoom(factor){scale=Math.max(.45,Math.min(2.6,scale*factor));draw();}
function resetView(){yaw=-.38;pitch=.18;hover=null;fit();}
canvas.addEventListener('wheel',event=>{event.preventDefault();zoom(Math.exp(-event.deltaY*.0013));},{passive:false});
canvas.addEventListener('keydown',event=>{
  if(['+','=','-','0',' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key))event.preventDefault();
  if(event.key==='+'||event.key==='=')zoom(1.2);if(event.key==='-')zoom(1/1.2);if(event.key==='0')resetView();if(event.key===' ')setAutoRotate(!autoRotate);
  const delta={ArrowUp:[0,-.15],ArrowDown:[0,.15],ArrowLeft:[-.15,0],ArrowRight:[.15,0]}[event.key];
  if(delta){setAutoRotate(false);yaw+=delta[0];pitch+=delta[1];hover=null;draw();}
});
document.getElementById('auto-rotate').addEventListener('click',()=>setAutoRotate(!autoRotate));
document.getElementById('zoom-in').addEventListener('click',()=>zoom(1.2));
document.getElementById('zoom-out').addEventListener('click',()=>zoom(1/1.2));
document.getElementById('fit').addEventListener('click',resetView);
search.addEventListener('input',()=>{query=search.value.trim().toLocaleLowerCase();setAutoRotate(false);renderList();draw();});
const resize=new ResizeObserver(()=>{const rect=canvas.getBoundingClientRect();width=rect.width;height=rect.height;dpr=window.devicePixelRatio||1;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);fit();});
resize.observe(canvas);
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{document.querySelectorAll('.legend span').forEach((el,i)=>el.querySelector('.dot').style.background=getColor(legendTypes[i][0]));document.querySelector('#reader-type .dot').style.background=getColor(byId.get(selected));renderList();draw();});
reducedMotion.addEventListener('change',event=>{if(event.matches)setAutoRotate(false);});
document.addEventListener('visibilitychange',wake);
selectNote(selected);setAutoRotate(autoRotate);
}
</script>
</body>
</html>
